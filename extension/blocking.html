<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusGuard Block</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #1a1a1a;
        color: #ffffff;
        font-family: system-ui, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: min(720px, 100%);
        text-align: center;
      }

      h1 {
        margin: 0 0 24px;
        color: #ff4d4f;
        font-size: 72px;
      }

      p {
        margin: 10px 0;
        font-size: 20px; /* blocked url and reasons */
        line-height: 1.5;
        word-break: break-word;
      }

      .label {
        color: #a6a6a6;
        font-size: 14px; /* small labels */
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .value {
        font-size: 20px; /* white screen */
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        margin-top: 28px;
      }

      button {
        border: none;
        border-radius: 8px;
        padding: 18px 28px;
        font-size: 22px; /* buttons */
        font-weight: 700;
        color: #ffffff;
        cursor: pointer;
      }

      #allowButton {
        background: #2e7d32;
      }

      #closeButton {
        background: #c62828;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>&#128683; Focus Break</h1>
      <p class="label">Blocked URL</p>
      <p id="blockedUrl" class="value"></p>
      <p class="label">Reason</p>
      <p id="blockReason" class="value"></p>
      <div class="actions">
        <button id="allowButton" type="button">&#9989; I was actually studying this</button>
        <button id="closeButton" type="button">&#10060; Close this tab</button>
      </div>
    </main>
    <script src="blocking.js"></script>
  </body>
</html>
